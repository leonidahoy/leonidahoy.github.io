name: Publicar en GitHub Pages

# Construye la web, minifica CSS/JS y la publica en la rama gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Comprobar los trucos
        run: node scripts/check-trucos.mjs
      - name: Comprobar descubrimientos y parches
        run: node scripts/check-juego.mjs
      - name: Comprobar clips
        run: node scripts/check-clips.mjs
      - name: Comprobar el test
        run: node scripts/check-quiz.mjs
      - name: Construir la web
        run: node scripts/build.mjs
        env:
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          SITE_URL: ${{ vars.SITE_URL }}
          CLIPS_VERIFY: "1"
      - name: Minificar CSS y JS
        run: npx --yes esbuild@0.25.0 _site/assets/app.js _site/assets/styles.css --minify --outdir=_site/assets --allow-overwrite --log-level=warning
      - name: Publicar en gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Avisar a los buscadores (IndexNow)
        continue-on-error: true
        run: |
          sleep 90
          node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
